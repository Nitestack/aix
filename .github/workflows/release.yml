name: Release

# release-plz flow:
#   1. Run the "Prepare release" workflow (prepare-release.yml) when you want
#      to cut a release, choosing patch/minor/major or an explicit version.
#      It opens a "chore: release vX.Y.Z" PR (Cargo.toml, Cargo.lock, and
#      CHANGELOG.md generated from Conventional Commits).
#   2. Merging that PR bumps Cargo.toml on main; this workflow publishes the
#      new version to crates.io, tags vX.Y.Z, creates the GitHub release, and
#      attaches prebuilt binaries and updates package managers.
#
# crates.io auth uses Trusted Publishing (OIDC, `id-token: write`). A
# CARGO_REGISTRY_TOKEN secret is only needed to bootstrap the very first
# publish of a new crate; delete it once Trusted Publishing is configured.
#
# Tags/releases created with GITHUB_TOKEN do not trigger other workflows,
# which is why the binary build runs in this workflow off release-plz's outputs.

on:
  push:
    branches: [main]

# Deliberately no workflow-level concurrency: even with cancel-in-progress
# false, GitHub drops a *pending* run when a newer one queues, which could skip
# a release. `release-plz release` is idempotent (it only publishes versions
# missing from crates.io), so overlapping runs are safe.

jobs:
  release:
    name: Publish release
    if: github.repository_owner == 'get-aix'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    outputs:
      releases: ${{ steps.release-plz.outputs.releases }}
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      # Only exported when the secret exists, so release-plz falls back to
      # Trusted Publishing instead of seeing an empty token.
      - name: Use bootstrap crates.io token
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        if: env.BOOTSTRAP_TOKEN != ''
        run: echo "CARGO_REGISTRY_TOKEN=${BOOTSTRAP_TOKEN}" >> "$GITHUB_ENV"

      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build
    needs: release
    if: needs.release.outputs.releases_created == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ fromJSON(needs.release.outputs.releases)[0].tag }}

  upload:
    name: Upload binaries
    needs: [release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: binaries

      - name: Attach binaries to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ fromJSON(needs.release.outputs.releases)[0].tag }}
        run: gh release upload "$TAG" binaries/* --clobber --repo "$GITHUB_REPOSITORY"

  packages:
    name: Package managers
    needs: [release, upload]
    uses: ./.github/workflows/packages.yml
    with:
      tag: ${{ fromJSON(needs.release.outputs.releases)[0].tag }}
    secrets: inherit
