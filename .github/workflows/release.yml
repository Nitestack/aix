name: Release

on:
  push:
    branches: [main]

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build x86_64-unknown-linux-gnu
        run: cross build --release --target x86_64-unknown-linux-gnu

      - name: Build aarch64-unknown-linux-gnu
        run: cross build --release --target aarch64-unknown-linux-gnu

      - name: Stage Linux artifacts
        run: |
          mkdir -p stage
          cp target/x86_64-unknown-linux-gnu/release/aix stage/aix-x86_64-unknown-linux-gnu
          cp target/aarch64-unknown-linux-gnu/release/aix stage/aix-aarch64-unknown-linux-gnu

      - uses: actions/upload-artifact@v7
        with:
          name: linux-binaries
          path: stage/

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build aarch64-apple-darwin
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build x86_64-apple-darwin
        run: cargo build --release --target x86_64-apple-darwin

      - name: Stage macOS artifacts
        run: |
          mkdir -p stage
          cp target/aarch64-apple-darwin/release/aix stage/aix-aarch64-apple-darwin
          cp target/x86_64-apple-darwin/release/aix stage/aix-x86_64-apple-darwin

      - uses: actions/upload-artifact@v7
        with:
          name: macos-binaries
          path: stage/

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build x86_64-pc-windows-msvc
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage
          Copy-Item target\x86_64-pc-windows-msvc\release\aix.exe stage\aix-x86_64-pc-windows-msvc.exe

      - uses: actions/upload-artifact@v7
        with:
          name: windows-binary
          path: stage/

  release:
    name: Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Stage installer scripts
        run: |
          cp scripts/install.sh artifacts/install.sh
          cp scripts/install.ps1 artifacts/install.ps1

      - name: Upsert latest release
        run: |
          SHORT="${{ github.sha }}"
          SHORT="${SHORT:0:7}"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          cat > release-notes.md << EOF
          ## aix — latest build

          Built from [\`main\`](${REPO_URL}/commits/main) at commit [\`${SHORT}\`](${REPO_URL}/commit/${{ github.sha }}).

          > **Rolling release** — rebuilt and replaced on every push to \`main\`. There is no semantic versioning; this tag always points to the current tip of \`main\`.

          ---

          ## Downloads

          Pick the binary for your platform:

          | File | Platform |
          |------|----------|
          | \`aix-x86_64-unknown-linux-gnu\` | Linux x86_64 (most desktop/server Linux) |
          | \`aix-aarch64-unknown-linux-gnu\` | Linux aarch64 (ARM64 — Raspberry Pi, AWS Graviton, etc.) |
          | \`aix-aarch64-apple-darwin\` | macOS Apple Silicon (M1 / M2 / M3 / M4) |
          | \`aix-x86_64-apple-darwin\` | macOS Intel |
          | \`aix-x86_64-pc-windows-msvc.exe\` | Windows x86_64 |

          ---

          ## Quick install

          **Linux / macOS:**

          \`\`\`sh
          curl -fsSL ${REPO_URL}/releases/latest/download/install.sh | sh
          \`\`\`

          **Windows (PowerShell):**

          \`\`\`powershell
          irm ${REPO_URL}/releases/latest/download/install.ps1 | iex
          \`\`\`

          Both installers place the binary in a user-local directory and add it to your PATH automatically. Override the install location by setting \`AIX_INSTALL_DIR\` before running.

          See the [README](${REPO_URL}/blob/main/README.md) for configuration and usage.
          EOF
          gh release delete latest --yes 2>/dev/null || true
          git tag -f latest ${{ github.sha }}
          git push -f origin latest
          gh release create latest \
            --title "Latest" \
            --notes-file release-notes.md \
            artifacts/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
