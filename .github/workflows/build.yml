name: Build binaries

# Reusable workflow: cross-compiles release binaries for every supported
# platform and uploads them as one `binaries` workflow artifact.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (tag or SHA) to build.
        required: true
        type: string

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # musl: fully static, runs on any distro (used by installers/packages).
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, cross: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, cross: true }
          # gnu: kept for existing direct-download URLs.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, cross: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, cross: true }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: .exe }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        shell: bash
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --locked --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p stage
          cp "target/${{ matrix.target }}/release/aix${{ matrix.ext }}" \
             "stage/aix-${{ matrix.target }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v7
        with:
          name: aix-${{ matrix.target }}
          path: stage/

  collect:
    name: Collect binaries
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/download-artifact@v8
        with:
          pattern: aix-*
          path: binaries
          merge-multiple: true

      - name: Install nfpm
        env:
          NFPM_VERSION: 2.48.0
        run: |
          base="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
          tarball="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSL "${base}/checksums.txt" | grep " ${tarball}\$" | sha256sum --check -
          tar -xzf "${tarball}" nfpm
          sudo install -m 755 nfpm /usr/local/bin/nfpm

      - name: Build .deb and .rpm packages
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          export VERSION
          mkdir -p pkg
          for arch in amd64 arm64; do
            case "$arch" in amd64) triple=x86_64 ;; arm64) triple=aarch64 ;; esac
            install -m 755 "binaries/aix-${triple}-unknown-linux-musl" pkg/aix
            for format in deb rpm; do
              ARCH="$arch" nfpm package -f scripts/packaging/nfpm.yaml -p "$format" -t binaries/
            done
          done

      - name: Add checksums and installer scripts
        working-directory: binaries
        run: |
          sha256sum aix-* aix_* > SHA256SUMS
          cat SHA256SUMS
          cp ../scripts/install.sh ../scripts/install.ps1 .

      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: binaries/
