[package]
name = "aix-rs"
version = "1.0.0"
edition = "2021"
description = "Manage AI gateway profiles and launch AI coding tools with the right credentials"
readme = "README.md"
license = "AGPL-3.0-only"
repository = "https://github.com/get-aix/aix"
homepage = "https://github.com/get-aix/aix"
keywords = ["ai", "llm", "litellm", "gateway", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/src/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[[bin]]
name = "aix"
path = "src/main.rs"

[dependencies]
clap        = { version = "4", features = ["derive", "env"] }
toml        = "0.8"
serde_yaml  = "0.9"
json5       = "0.4"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
directories = "6"
which       = "8"
shellexpand = "3"
dotenvy     = "0.15"
inquire     = { version = "0.9", default-features = false, features = ["crossterm"] }
thiserror   = "2"
color-eyre  = { version = "0.6", default-features = false }
zeroize     = "1"
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
axum        = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
futures-util = "0.3"
tokio       = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "io-util", "sync"] }
owo-colors  = { version = "4", features = ["supports-colors"] }
chrono      = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid        = { version = "1", features = ["serde", "v4"] }
base64      = "0.22"
fs2         = "0.4"
jsonwebtoken = "9"
sha2        = "0.10"
tempfile    = "3"
url         = "2"
webbrowser  = "1"
ctrlc       = "3"
time        = { version = "0.3", features = ["formatting"] }

[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.3", features = ["extended-siginfo"] }
nix = { version = "0.31", features = ["process", "signal"] }

[dev-dependencies]
assert_cmd = "2"
assert_fs  = "1"
predicates = "3"
wiremock   = "0.6"

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31", features = ["term"] }
