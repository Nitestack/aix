[package]
name = "aix"
version = "0.1.0"
edition = "2021"
readme = "README.md"

[[bin]]
name = "aix"
path = "src/main.rs"

[dependencies]
clap        = { version = "4", features = ["derive", "env"] }
toml        = "0.8"
serde_yaml  = "0.9"
json5       = "0.4"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
directories = "6"
which       = "8"
shellexpand = "3"
dotenvy     = "0.15"
inquire     = { version = "0.9", default-features = false, features = ["crossterm"] }
thiserror   = "2"
color-eyre  = { version = "0.6", default-features = false }
zeroize     = "1"
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio       = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "io-util"] }
owo-colors  = { version = "4", features = ["supports-colors"] }
chrono      = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid        = { version = "1", features = ["serde", "v4"] }
base64      = "0.22"
fs2         = "0.4"
jsonwebtoken = "9"
sha2        = "0.10"
tempfile    = "3"
url         = "2"
webbrowser  = "1"
ctrlc       = "3"
time        = { version = "0.3", features = ["formatting"] }
signal-hook = "0.3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["process", "signal"] }

[dev-dependencies]
assert_cmd = "2"
assert_fs  = "1"
predicates = "3"
wiremock   = "0.6"

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31", features = ["term"] }
