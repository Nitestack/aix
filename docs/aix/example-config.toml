# aix example configuration
# Copy to ~/.config/aix/aix.toml and fill in your values.

# Optional: profile selected when no --profile flag is given and stdin is
# not a TTY (e.g. in scripts). Remove to always prompt interactively.
default_profile = "work"

# Optional: .env files loaded before the CLI runs. The real process
# environment always wins — these files only fill in missing vars.
# env_files = ["~/.config/aix/secrets.env"]

# ---------------------------------------------------------------------------
# Endpoint — describes the AI gateway this config targets
# ---------------------------------------------------------------------------

[endpoint]
# Credential variable sets aix can provide:
#   ANTHROPIC_API_KEY, ANTHROPIC_BASE_URL
#   OPENAI_API_KEY,    OPENAI_BASE_URL   (base_url with "/v1" appended)
#   LITELLM_API_KEY,   LITELLM_BASE_URL  (base_url with "/v1" appended)
#
# `aix env`, `aix exec`, and unconfigured `aix run` emit all seven variables.
# Named tools select a format via [tools.<name>].api_format; without an entry,
# `aix claude` uses Anthropic and other tool names use OpenAI. LITELLM_* is
# included for all profile-backed child launches.

# Where to find the gateway URL. Supported secret sources:
#   { env  = "VAR_NAME" }           — read from environment variable
#   { file = "/run/secrets/url" }   — read from file (trailing newline stripped)
#   { command = "op read ..." }     — stdout of a command
#   "https://gateway.example.com"   — literal value (avoid for secrets)
base_url = { env = "AIX_BASE_URL" }

# ---------------------------------------------------------------------------
# Profiles — named sets of credentials
# ---------------------------------------------------------------------------

[profiles.work]
label = "Work"                    # shown in interactive picker
api_key = { env = "AIX_API_KEY" }
# Optional: override [endpoint].base_url for this profile.
# base_url = { env = "AIX_WORK_BASE_URL" }

# Optional: inject additional variables with valid shell-environment names. These are
# appended after generated variables, so an explicit value can override a generated variable.
# [profiles.work.env]
# EXAMPLE_FEATURE_FLAG = "enabled"

[profiles.local]
label = "Local (no auth)"
api_key = "sk-no-key"     # literal — fine for a local dev gateway

# [profiles.personal]
# label   = "Personal"
# api_key = { file = "/run/secrets/aix/personal" }

# Optional shared model default and local aliases for `aix ask`.
[models]
default = "gateway/model-default"

[models.aliases]
fast = "gateway/model-fast"

# Optional generic launch wiring. It applies to both `aix review ...` and
# `aix run -- review ...`; no harness-specific behavior is built in.
[tools.review]
command = "review-agent" # optional; defaults to "review"
api_format = "both"      # anthropic, openai, or both

[tools.review.env]
REVIEW_MODE = "review"
REVIEW_TOKEN = { env = "AIX_REVIEW_TOKEN" }
